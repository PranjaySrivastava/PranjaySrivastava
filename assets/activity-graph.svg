<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%" height="100%">
  <defs>
    <!-- Tokyo Night Theme Gradients -->
    <linearGradient id="areaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a1b26" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7dcfff"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-rect { fill: #1a1b26; stroke: #24283b; stroke-width: 1px; rx: 6px; }
      .header-title { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 16px; font-weight: 600; fill: #7aa2f7; }
      .sub-title { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 12px; fill: #565f89; }
      .axis-text { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 11px; fill: #787c99; }
      .grid-line { stroke: #24283b; stroke-dasharray: 4 4; stroke-width: 1px; }
      .data-point { fill: #7aa2f7; stroke: #1a1b26; stroke-width: 2.5px; }
      .data-point:hover { fill: #bb9af7; r: 6px; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="850" height="300" class="bg-rect" />

  <!-- Header -->
  <g transform="translate(30, 36)">
    <text x="0" y="0" class="header-title">Contribution Activity Graph</text>
    <text x="210" y="0" class="sub-title">• 2025 – 2026</text>
  </g>

  <!-- Total Stats Pill -->
  <g transform="translate(680, 24)">
    <rect width="140" height="24" rx="12" fill="#24283b" />
    <circle cx="14" cy="12" r="4" fill="#73daca" />
    <text x="26" y="16" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="11px" font-weight="600" fill="#c0caf5">Active Contributor</text>
  </g>

  <!-- Plot Area -->
  <g transform="translate(50, 70)">
    <!-- Horizontal Grid Lines -->
    <line x1="0" y1="0" x2="760" y2="0" class="grid-line" />
    <text x="-35" y="4" class="axis-text">20+</text>

    <line x1="0" y1="45" x2="760" y2="45" class="grid-line" />
    <text x="-35" y="49" class="axis-text">15</text>

    <line x1="0" y1="90" x2="760" y2="90" class="grid-line" />
    <text x="-35" y="94" class="axis-text">10</text>

    <line x1="0" y1="135" x2="760" y2="135" class="grid-line" />
    <text x="-35" y="139" class="axis-text">5</text>

    <line x1="0" y1="180" x2="760" y2="180" stroke="#2f354f" stroke-width="1.5px" />
    <text x="-35" y="184" class="axis-text">0</text>

    <!-- Shaded Area Chart Path -->
    <path d="M 0 180 
             L 0 160 
             Q 35 155, 69 130 
             T 138 140 
             T 207 105 
             T 276 115 
             T 345 60 
             T 414 75 
             T 483 30 
             T 552 45 
             T 621 20 
             T 690 35 
             T 760 10 
             L 760 180 Z" 
          fill="url(#areaGradient)" />

    <!-- Smooth Bezier Line Path -->
    <path d="M 0 160 
             Q 35 155, 69 130 
             T 138 140 
             T 207 105 
             T 276 115 
             T 345 60 
             T 414 75 
             T 483 30 
             T 552 45 
             T 621 20 
             T 690 35 
             T 760 10" 
          fill="none" 
          stroke="url(#lineGradient)" 
          stroke-width="3" 
          stroke-linecap="round" 
          filter="url(#glow)" />

    <!-- Interactive Data Point Circles -->
    <circle cx="0" cy="160" r="4.5" class="data-point" />
    <circle cx="69" cy="130" r="4.5" class="data-point" />
    <circle cx="138" cy="140" r="4.5" class="data-point" />
    <circle cx="207" cy="105" r="4.5" class="data-point" />
    <circle cx="276" cy="115" r="4.5" class="data-point" />
    <circle cx="345" cy="60" r="4.5" class="data-point" />
    <circle cx="414" cy="75" r="4.5" class="data-point" />
    <circle cx="483" cy="30" r="4.5" class="data-point" />
    <circle cx="552" cy="45" r="4.5" class="data-point" />
    <circle cx="621" cy="20" r="4.5" class="data-point" />
    <circle cx="690" cy="35" r="4.5" class="data-point" />
    <circle cx="760" cy="10" r="5" fill="#73daca" stroke="#1a1b26" stroke-width="2.5px" />

    <!-- Month Axis Labels (12 months) -->
    <text x="0" y="202" class="axis-text" text-anchor="middle">Oct</text>
    <text x="69" y="202" class="axis-text" text-anchor="middle">Nov</text>
    <text x="138" y="202" class="axis-text" text-anchor="middle">Dec</text>
    <text x="207" y="202" class="axis-text" text-anchor="middle">Jan</text>
    <text x="276" y="202" class="axis-text" text-anchor="middle">Feb</text>
    <text x="345" y="202" class="axis-text" text-anchor="middle">Mar</text>
    <text x="414" y="202" class="axis-text" text-anchor="middle">Apr</text>
    <text x="483" y="202" class="axis-text" text-anchor="middle">May</text>
    <text x="552" y="202" class="axis-text" text-anchor="middle">Jun</text>
    <text x="621" y="202" class="axis-text" text-anchor="middle">Jul</text>
    <text x="690" y="202" class="axis-text" text-anchor="middle">Aug</text>
    <text x="760" y="202" class="axis-text" text-anchor="middle">Sep</text>
  </g>
</svg>
