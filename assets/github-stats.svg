<svg xmlns="http://www.w3.org/2000/svg" width="350" height="195" viewBox="0 0 350 195" fill="none">
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #70a5fd;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    .stat-label {
      font: 400 13px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #a9b1d6;
    }
    .stat-bold {
      font: 700 13px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #c0caf5;
    }
    .icon {
      fill: #bf91f3;
    }
    .card-bg {
      fill: #1a1b26;
      stroke: #24283b;
      stroke-width: 1px;
      rx: 6px;
    }
  </style>

  <rect width="350" height="195" class="card-bg" />

  <g transform="translate(25, 35)">
    <!-- Header -->
    <text x="0" y="0" class="header">Pranjay's GitHub Stats</text>
  </g>

  <g transform="translate(25, 55)">
    <!-- Stars -->
    <g transform="translate(0, 20)">
      <svg class="icon" viewBox="0 0 16 16" width="16" height="16">
        <path fill-rule="evenodd" d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"></path>
      </svg>
      <text class="stat-label" x="25" y="12.5">Total Stars Earned:</text>
      <text class="stat-bold" x="200" y="12.5">1</text>
    </g>

    <!-- Repositories -->
    <g transform="translate(0, 45)">
      <svg class="icon" viewBox="0 0 16 16" width="16" height="16">
        <path fill-rule="evenodd" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"></path>
      </svg>
      <text class="stat-label" x="25" y="12.5">Total Repositories:</text>
      <text class="stat-bold" x="200" y="12.5">22</text>
    </g>

    <!-- Forks -->
    <g transform="translate(0, 70)">
      <svg class="icon" viewBox="0 0 16 16" width="16" height="16">
        <path fill-rule="evenodd" d="M5 3.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm0 2.122a2.25 2.25 0 10-1.5 0v.878A2.25 2.25 0 005.75 8.5h1.5v2.128a2.251 2.251 0 101.5 0V8.5h1.5a2.25 2.25 0 002.25-2.25v-.878a2.25 2.25 0 10-1.5 0v.878a.75.75 0 01-.75.75h-4.5A.75.75 0 015 6.25v-.878zm3.75 7.378a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm3-8.75a.75.75 0 100-1.5.75.75 0 000 1.5z"></path>
      </svg>
      <text class="stat-label" x="25" y="12.5">Total Forks:</text>
      <text class="stat-bold" x="200" y="12.5">4</text>
    </g>

    <!-- Followers -->
    <g transform="translate(0, 95)">
      <svg class="icon" viewBox="0 0 16 16" width="16" height="16">
        <path fill-rule="evenodd" d="M5.5 3.5a2 2 0 100 4 2 2 0 000-4zM2 5.5a3.5 3.5 0 115.898 2.549 5.508 5.508 0 013.034 4.084.75.75 0 11-1.482.235 4.001 4.001 0 00-7.9 0 .75.75 0 01-1.482-.236A5.507 5.507 0 012 5.5z"></path>
      </svg>
      <text class="stat-label" x="25" y="12.5">Followers:</text>
      <text class="stat-bold" x="200" y="12.5">7</text>
    </g>
  </g>
</svg>
