name: Update Arcade Contribution Graphs

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-arcade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Pac-Man & Breakout Contribution Graphs
        run: |
          npm install -g pacman-contribution-graph
          mkdir -p assets
          pacman-contribution-graph --platform github --username ${{ github.repository_owner }} --game pacman --gameTheme github-dark --output ./assets/pacman-contribution-graph-dark.svg
          pacman-contribution-graph --platform github --username ${{ github.repository_owner }} --game breakout --gameTheme github-dark --output ./assets/breakout-contribution-graph-dark.svg

      - name: Push updated SVG to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🎮 Auto-update Arcade Contribution Graphs [skip ci]"
          file_pattern: "assets/*.svg"
